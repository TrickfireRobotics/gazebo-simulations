controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 60 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - wrist_2
      - wrist_1
      - elbow_1
      - shoulder_1

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
