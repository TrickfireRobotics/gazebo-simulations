controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 60 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      # no revolute joints found - fill in manually

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
