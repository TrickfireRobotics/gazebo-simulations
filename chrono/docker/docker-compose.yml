# --------------------------------------------------------------------------------------------
# chrono Simulation Environment (Project Chrono SCM)
# TODO: implement chrono-runtime stage in docker/Dockerfile
# --------------------------------------------------------------------------------------------

services:
  sim:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: chrono-runtime
    image: simulations-chrono:latest
    container_name: simulations-chrono
    user: trickfire

    environment:
      DISPLAY: "${DISPLAY:-:0}"
      TZ: ${TZ:-UTC}

    volumes:
      - ../..:/home/trickfire/simulations

    working_dir: /home/trickfire/simulations

    stdin_open: true
    tty: true
