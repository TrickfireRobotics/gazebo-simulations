# --------------------------------------------------------------------------------------------
# Gazebo Simulation Environment (Local NVIDIA GPU usage)
# Extends docker-compose.yml for local development.
# Local override adds X11 socket mount and keeps the container alive for shell attach.
#
# Usage:
#   ./scripts/nvidia-container.sh --local
# --------------------------------------------------------------------------------------------

services:
  sim:
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: sleep infinity