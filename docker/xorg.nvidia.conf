Section "Module"
  Load "glx"
EndSection

Section "Device"
  Identifier "NvidiaDevice"
  Driver "nvidia"
  Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Monitor"
  Identifier "NvidiaMonitor"
  HorizSync 28-80
  VertRefresh 48-75
EndSection

Section "Screen"
  Identifier "NvidiaScreen"
  Device "NvidiaDevice"
  Monitor "NvidiaMonitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1920x1080"
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier "NvidiaLayout"
  Screen "NvidiaScreen"
EndSection
