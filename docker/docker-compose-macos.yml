# macOS + XQuartz addon compose for base compose.
#
# Docker Desktop for Mac runs containers inside a Linux VM and cannot bind-mount the host's
# X11/Wayland unix sockets into the container (Docker Desktop only special-cases a handful of
# sockets like docker.sock and the ssh-agent socket - arbitrary sockets, including XQuartz's,
# aren't shared through its virtiofs/gRPC-FUSE file sharing). So instead of a socket bind mount,
# GUI windows are forwarded over the X11 protocol's native TCP transport to XQuartz, which Docker
# Desktop's "host.docker.internal" DNS name makes reachable from inside the container.
#
# Setup required on the Mac host (see docs/setup/docker.mdx for details):
#   1. Install XQuartz: https://www.xquartz.org
#   2. XQuartz > Settings > Security > check "Allow connections from network clients", then
#      log out/restart XQuartz for it to take effect.
#   3. In a Terminal: `xhost + 127.0.0.1`
#
# Use this file instead of docker-compose-gpu.yml (there is no GPU passthrough on macOS).
#
# XQuartz can display windows but cannot provide a usable OpenGL context - its indirect GLX
# is deprecated and broken (XQuartz/XQuartz#144), so Gazebo/RViz (OGRE2) can't render through
# it directly. GL rendering therefore goes through VirtualGL against a local headless X server
# inside the container, with only finished frames sent to XQuartz as plain X11 images.
# x_server.sh starts that 3D X server; `sim gazebo` wraps the launch in `vglrun`.

services:
  sim:
    environment:
      # XQuartz's default display is :0. QT_X11_NO_MITSHM is already set to 1 in the base
      # compose file, which is required here too: MIT-SHM assumes a local shared-memory
      # segment, which doesn't exist across this TCP connection.
      DISPLAY: "host.docker.internal:0"
      # Display number of the container-local X server VirtualGL renders into (started by
      # .devcontainer/x_server.sh). Kept clear of :0 and of FORCE_VNC's :77.
      VGL_DISPLAY: ":88"
      # VirtualGL's X11 Transport: deliver rendered frames as ordinary X11 images over the
      # existing connection. Avoids needing a vglclient process on the Mac or an extra port.
      VGL_COMPRESS: "proxy"
