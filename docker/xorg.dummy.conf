Section "ServerFlags"
  # Prevent Xorg from auto-probing and attaching real /dev/dri devices (this
  # container has host device access via `privileged: true`). Without this,
  # Xorg grabs the host's real GPU/display-subsystem DRM nodes even with the
  # dummy driver configured, which can steal DRM master from a live compositor
  # (e.g. Hyprland) running on the same physical display and blank the screen.
  Option "AutoAddGPU" "off"
  Option "AutoEnableDevices" "off"
EndSection

Section "Module"
  Load "glx"
EndSection

Section "Device"
  Identifier "DummyDevice"
  Driver "dummy"
  VideoRam 512000
EndSection

Section "Monitor"
  Identifier "DummyMonitor"
  HorizSync 28-80
  VertRefresh 48-75
EndSection

Section "Screen"
  Identifier "DummyScreen"
  Device "DummyDevice"
  Monitor "DummyMonitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1920x1080"
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier "DummyLayout"
  Screen "DummyScreen"
EndSection
