services:
  sim:
    environment:
      # - FORCE_VNC=1
      - WAYLAND_DISPLAY
      - XDG_RUNTIME_DIR=/run/host-runtime
      - QT_SCALE_FACTOR
      - QT_ENABLE_HIGHDPI_SCALING
      - GDK_SCALE
      - GDK_DPI_SCALE
    build:
      args:
        USER_UID: "${UID:-1000}"
    volumes:
      - ${XDG_RUNTIME_DIR:-/tmp}:/run/host-runtime:ro
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME}/.config/trickfire
        target: /home/trickfire/.config/trickfire
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME}/.ssh
        target: /home/trickfire/.ssh
        read_only: true
        bind:
          create_host_path: true
