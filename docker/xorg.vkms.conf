Section "Module"
  Load "glx"
EndSection

Section "Device"
  Identifier "VKMSDevice"
  Driver "modesetting"
  Option "kmsdev" "__VKMS_CARD__"
  Option "DRI" "3"
EndSection

Section "Monitor"
  Identifier "DummyMonitor"
  HorizSync 28-80
  VertRefresh 48-75
EndSection

Section "Screen"
  Identifier "DummyScreen"
  Device "VKMSDevice"
  Monitor "DummyMonitor"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1920x1080"
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier "DummyLayout"
  Screen "DummyScreen"
EndSection
