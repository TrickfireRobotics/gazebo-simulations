services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: sim
      network: host
    image: simulations:latest
    container_name: simulations
    user: trickfire

    environment:
      DISPLAY: "${DISPLAY:-:0}"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
      QT_X11_NO_MITSHM: "1"
      TZ: ${TZ:-UTC}

    volumes:
      - ..:/home/trickfire/simulations
      - /lib/modules:/lib/modules:ro
      - type: bind
        source: ${XDG_RUNTIME_DIR:-/run/user/1000}
        target: /run/user/1000
        bind:
          create_host_path: true

    working_dir: /home/trickfire/simulations

    ports:
      - "5900:5900"
      - "6080:6080"

    privileged: true

    stdin_open: true
    tty: true
