# --------------------------------------------------------------------------------------------
# Gazebo Simulation Environment
# Runs on NVIDIA Jetson host with GPU support
# Includes X11 server and VNC/noVNC for remote display
# Automatically starts X server via startup script
# --------------------------------------------------------------------------------------------

services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    image: gazebo-simulations:latest
    container_name: gazebo-sim
    user: trickfire

    runtime: nvidia

    environment:
      DISPLAY: ":1"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,compute,utility
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
      # Tegra libdrm.so.2 is missing drmCloseBufferHandle; stub it so Mesa swrast loads.
      LD_PRELOAD: /usr/local/lib/libdrm_stub.so
      PROMPT_ENV: ${HOSTNAME:-nvidia}-sim
      TZ: ${TZ:-UTC}

    volumes:
      - ..:/home/trickfire/gazebo-simulations

    working_dir: /home/trickfire/gazebo-simulations

    ports:
      - "5900:5900"
      - "6080:6080"

    privileged: true

    command: scripts/start_x_server.sh

    stdin_open: true
    tty: true
