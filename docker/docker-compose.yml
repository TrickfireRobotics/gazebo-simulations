services:
    sim:
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: sim
            network: host
            args:
                VNC_PORT: "${VNC_PORT:?VNC_PORT must be set, see docker/.env}"
                NOVNC_PORT: "${NOVNC_PORT:?NOVNC_PORT must be set, see docker/.env}"
                ROSBRIDGE_PORT: "${ROSBRIDGE_PORT:?ROSBRIDGE_PORT must be set, see docker/.env}"
        image: simulations:latest
        container_name: simulations
        user: trickfire

        # nvidia runtime, enabled only when the host has a working GPU. Detected on
        # the host by .devcontainer/detect-host-env.sh, which writes SIM_GPU_RUNTIME
        # into docker/.env (empty on non-GPU hosts, where compose omits `runtime`
        # entirely and falls back to the default runtime).
        runtime: "${SIM_GPU_RUNTIME:-}"

        # Host-detected container env (DISPLAY + VirtualGL, and NVIDIA_* when a GPU
        # is present). Generated on the host into docker/.env.host by
        # .devcontainer/detect-host-env.sh (initializeCommand), so one config
        # forwards the right display per-platform with no variant to pick.
        # required:false: harmless if absent (e.g. raw `docker compose` outside the
        # devcontainer, which doesn't run initializeCommand).
        env_file:
            - path: .env.host
              required: false

        environment:
            VNC_PORT: "${VNC_PORT:?VNC_PORT must be set, see docker/.env}"
            NOVNC_PORT: "${NOVNC_PORT:?NOVNC_PORT must be set, see docker/.env}"
            ROSBRIDGE_PORT: "${ROSBRIDGE_PORT:?ROSBRIDGE_PORT must be set, see docker/.env}"
            QT_X11_NO_MITSHM: "1"
            TZ: ${TZ:-UTC}

        volumes:
            - ..:/home/trickfire/simulations
            - /lib/modules:/lib/modules:ro
            - type: bind
              source: ${XDG_RUNTIME_DIR:-/run/user/1000}
              target: /run/user/1000
              bind:
                  create_host_path: true

        working_dir: /home/trickfire/simulations

        ports:
            - "${VNC_PORT}:${VNC_PORT}"
            - "${NOVNC_PORT}:${NOVNC_PORT}"
            - "${ROSBRIDGE_PORT}:${ROSBRIDGE_PORT}"

        privileged: true

        stdin_open: true
        tty: true
