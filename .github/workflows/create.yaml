name: Create new robot

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "Operation mode"
                required: true
                type: choice
                options:
                    - create
                    - update
            robot_name:
                description: "Robot name (unique, lowercase, no spaces)"
                required: true
                type: string
            onshape_url:
                description: "Model OnShape URL"
                required: false
                type: string
            attach_to_world:
                description: "Fix robot to the world?"
                required: true
                type: boolean

jobs:
    generate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  pip install onshape-to-robot
                  pip3 install open3d --ignore-installed blinker
                  pip install pipx
                  pipx install .

            - name: Validate inputs
              run: |
                  if [ "${{ inputs.mode }}" = "create" ] && [ -z "${{ inputs.onshape_url }}" ]; then
                    echo "ERROR: OnShape URL is required for 'create' mode"
                    exit 1
                  fi
                  if [ "${{ inputs.mode }}" = "update" ]; then
                    if ! python3 -c "import json; data=json.load(open('robots.json')); assert '${{ inputs.robot_name }}' in data"; then
                      echo "ERROR: Robot '${{ inputs.robot_name }}' not found in robots.json"
                      exit 1
                    fi
                  fi

            - name: Run sim
              env:
                  ONSHAPE_API_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
                  ONSHAPE_API_SECRET: ${{ secrets.ONSHAPE_SECRET_KEY }}
              run: |
                  if [ "${{ inputs.mode }}" = "create" ]; then
                    ATTACH_FLAG=$([[ "${{ inputs.attach_to_world }}" == "true" ]] && echo "--attach-to-world" || echo "--no-attach-to-world")
                    sim create "${{ inputs.robot_name }}" "${{ inputs.onshape_url }}" $ATTACH_FLAG
                  else
                    sim update "${{ inputs.robot_name }}"
                  fi

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: sim/${{ inputs.mode }}-${{ inputs.robot_name }}
                  commit-message: "[sim] ${{ inputs.mode }} ${{ inputs.robot_name }}"
                  title: "[sim] ${{ inputs.mode }} ${{ inputs.robot_name }}"
                  body: |
                      Automated PR from sim create/update workflow.

                      **Mode:** `${{ inputs.mode }}`
                      **Robot:** `${{ inputs.robot_name }}`
