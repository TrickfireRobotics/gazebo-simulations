# --------------------------------------------------------------------------------------------
# docker-compose.yml
# --------------------------------------------------------------------------------------------
# Runs the simulation environment on an Ubuntu host with VNC access.
#
# The project directory is mounted into the container, so:
#   - Pull new code on the HOST (git pull), changes are immediately visible inside
#   - Build artifacts (robot-sim/build, install, log) persist between container restarts
#
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Rebuild: docker compose up -d --build
#
# Connect via browser:
#   http://<host-ip>:6080/vnc.html
#
# Or over SSH tunnel:
#   ssh -L 6080:localhost:6080 user@host
#   then open: http://localhost:6080/vnc.html
#
# Once connected, open a terminal and run:
#   ./scripts/launch_sim.sh arm
# --------------------------------------------------------------------------------------------

services:
  sim:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: gazebo-simulations:latest
    container_name: gazebo-sim
    user: trickfire

    # runtime: nvidia

    environment:
      DISPLAY: ":1"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,compute,utility
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
      PROMPT_ENV: orin-sim

    volumes:
      - .:/home/trickfire/gazebo-simulations

    working_dir: /home/trickfire/gazebo-simulations

    ports:
      - "5900:5900"
      - "6080:6080"

    privileged: true

    command: scripts/start_x_server.sh

    stdin_open: true
    tty: true
