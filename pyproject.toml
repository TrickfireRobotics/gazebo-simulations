[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli"]

[project]
name = "sim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["rich"]

[project.scripts]
sim = "cli.main:main"

[tool.ruff]
exclude = ["robot-sim/build", "robot-sim/log", "robot-sim/install"]

line-length = 100
indent-width = 4

target-version = "py310"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = true

docstring-code-line-length = "dynamic"
